name: Deploy release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-release
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_RELEASE }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
        run: |
          npm install
          npm run build

      - name: Upload dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'dist/*'
          target: /var/www/bioscan-release
          strip_components: 1
          overwrite: true
